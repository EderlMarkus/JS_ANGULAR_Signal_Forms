<form>
  <div></div>
  <mat-form-field>
    <mat-label>Firstname</mat-label>
    <input matInput id="firstName" class="form-control" [formField]="userForm.firstName" />
    @for(error of userForm.firstName().errors(); track error){
    <mat-error>{{error.message}}</mat-error>
    }
  </mat-form-field>
  <div class="button">
    <button type="button" matButton="filled" [disabled]="!userForm().valid() || userForm().submitting()"
      (click)="saveProposal()">Save</button>
  </div>
</form>
